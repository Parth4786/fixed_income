[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapemark"
version = "0.3.0"
description = "Rates pricing library proven against publicly reported swap and swaption trades"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "pyarrow>=14", "numpy>=1.26", "scipy>=1.11", "requests>=2.31", "fastapi>=0.110", "uvicorn>=0.29", "scikit-learn>=1.4", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "QuantLib>=1.34", "httpx>=0.27"]
ui = ["playwright>=1.44"]  # only for tools/render_screens.py

[project.scripts]
tapemark = "tapemark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is left to the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
